name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint, type check, tokens, contrast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Type check (tsc)
        run: npm run type-check

      - name: Tokens up to date (tokens.anchors.css generated from light.ts)
        run: npm run tokens

      - name: Contrast check (AA across a full year of the light cycle)
        run: npm run check:contrast

      - name: Messaggi (catalogo e codice allineati, IT/EN in parità)
        run: npm run check:messaggi

  backend:
    name: Backend (lint, type check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type check (mypy)
        run: mypy app

      - name: Test (pytest)
        run: pytest

  supabase:
    name: Supabase (verifiche SQL su RLS/RPC/trigger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: latest

      - name: Chiave di firma JWT (richiesta da `supabase start`, mai committata)
        # `gen signing-key` scrive anche lui, come effetto collaterale, sul
        # signing_keys_path configurato (supabase/config.toml) — non solo
        # su stdout. Rediretto lì con `>`, la shell tronca il file a 0
        # byte PRIMA che il CLI parta: il CLI trova quel file appena
        # svuotato, prova a decodificarlo come chiavi preesistenti e
        # fallisce con "Unexpected EOF" (verificato in locale). Un array
        # vuoto valido come punto di partenza, più --append, evita la
        # corsa: non c'è redirect sullo stesso path che il CLI legge.
        run: |
          echo '[]' > supabase/signing_keys.json
          supabase gen signing-key --algorithm ES256 --append --yes

      - name: Avvia Supabase locale e applica le migrazioni
        # Esclusi solo i servizi che le verifiche non toccano: parlano
        # direttamente a Postgres, impersonando i ruoli con
        # `request.jwt.claims` invece di passare da PostgREST/Kong.
        run: supabase start --exclude studio,imgproxy,logflare,vector,mailpit,edge-runtime

      - name: Esegui le sei verifiche (ciascuna transazionale, con ROLLBACK finale)
        # Ogni script crea le proprie fixture e non lascia righe dietro di sé
        # (AGENTS.md, supabase/tests/*.sql): nessun seed esterno serve qui.
        # `-v ON_ERROR_STOP=1` è essenziale, altrimenti psql continua dopo un
        # fallimento invece di fermarsi al primo.
        run: |
          set -e
          for script in supabase/tests/verifica_*.sql; do
            echo "--- $script ---"
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$script"
          done

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Storico completo: necessario a Semgrep per confrontare la PR
          # con il branch di base nello scan diff-aware sotto.
          fetch-depth: 0

      - name: Semgrep (regole di default; su una PR blocca solo sui problemi nuovi)
        # `semgrep ci` fa scansione diff-aware in automatico quando gira su
        # una pull_request (confronta con il branch di base e segnala solo
        # ciò che la PR introduce); su push diretto a main, senza una PR con
        # cui confrontarsi, esegue una scansione completa.
        run: semgrep ci --config p/default
