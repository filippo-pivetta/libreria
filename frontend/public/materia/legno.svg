<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!--
    Venatura, non un'immagine di legno (design doc §2): feTurbulence
    anisotropo + feDisplacementMap, salvato una volta come file e
    ripetuto — mai ricalcolato a ogni frame. Non deve essere
    riconoscibile come legno, solo togliere la piattezza.
  -->
  <filter id="venatura" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.010 0.09"
      numOctaves="3"
      seed="7"
      stitchTiles="stitch"
      result="rumore"
    />
    <feDisplacementMap in="SourceGraphic" in2="rumore" scale="16" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <rect width="240" height="240" fill="#000" opacity="0.16" filter="url(#venatura)" />
</svg>
