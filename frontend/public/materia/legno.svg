<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
  <!--
    Venatura, non un'immagine di legno (design doc §2): feTurbulence
    anisotropo + feDisplacementMap, salvato una volta come file e
    ripetuto — mai ricalcolato a ogni frame. Non deve essere
    riconoscibile come legno, solo togliere la piattezza.

    feDisplacementMap sposta i pixel di SourceGraphic in base al rumore:
    su un riempimento uniforme l'interno resta identico a sé stesso
    spostato, quindi si vede solo il bordo della forma. Per questo la
    sorgente non è un rettangolo pieno ma tante righe sottili — è il
    bordo di ciascuna, piegato dal rumore, a diventare la grana.
  -->
  <filter id="venatura" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.010 0.09"
      numOctaves="3"
      seed="7"
      stitchTiles="stitch"
      result="rumore"
    />
    <feDisplacementMap in="SourceGraphic" in2="rumore" scale="18" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <g filter="url(#venatura)" fill="#000" opacity="0.14">
    <rect y="4" width="240" height="1.5" />
    <rect y="18" width="240" height="2.5" />
    <rect y="34" width="240" height="1" />
    <rect y="48" width="240" height="2" />
    <rect y="66" width="240" height="1.5" />
    <rect y="82" width="240" height="3" />
    <rect y="100" width="240" height="1" />
    <rect y="114" width="240" height="2" />
    <rect y="130" width="240" height="1.5" />
    <rect y="146" width="240" height="2.5" />
    <rect y="164" width="240" height="1" />
    <rect y="178" width="240" height="2" />
    <rect y="194" width="240" height="1.5" />
    <rect y="210" width="240" height="3" />
    <rect y="228" width="240" height="1.5" />
  </g>
</svg>
