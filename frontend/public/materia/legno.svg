<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400">
  <!--
    Venatura, non un'immagine di legno (design doc §2): feTurbulence
    anisotropo + feDisplacementMap, salvato una volta come file e
    ripetuto — mai ricalcolato a ogni frame. A bassissimo contrasto
    apposta: deve solo rompere la piattezza, mai leggersi come "legno".
    Tile grande (400px) e righe a passo irregolare, cosicché il punto
    in cui il motivo ricomincia non sia riconoscibile a occhio.
  -->
  <filter id="venatura" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.008 0.05"
      numOctaves="3"
      seed="11"
      stitchTiles="stitch"
      result="rumore"
    />
    <feDisplacementMap in="SourceGraphic" in2="rumore" scale="24" xChannelSelector="R" yChannelSelector="G" />
  </filter>
  <g filter="url(#venatura)" fill="#4a3520" opacity="0.07">
    <rect y="7" width="400" height="1" />
    <rect y="24" width="400" height="2" />
    <rect y="41" width="400" height="1" />
    <rect y="63" width="400" height="1.5" />
    <rect y="89" width="400" height="1" />
    <rect y="104" width="400" height="2.5" />
    <rect y="133" width="400" height="1" />
    <rect y="158" width="400" height="1.5" />
    <rect y="177" width="400" height="1" />
    <rect y="196" width="400" height="1" />
    <rect y="219" width="400" height="2" />
    <rect y="248" width="400" height="1" />
    <rect y="266" width="400" height="1.5" />
    <rect y="289" width="400" height="1" />
    <rect y="311" width="400" height="2.5" />
    <rect y="337" width="400" height="1" />
    <rect y="356" width="400" height="1.5" />
    <rect y="379" width="400" height="1" />
    <rect y="392" width="400" height="1" />
  </g>
</svg>
