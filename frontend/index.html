<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover`: senza, `env(safe-area-inset-*)` vale zero su iOS
         e la barra in fondo finisce sotto l'indicatore home. Lo zoom resta
         libero: bloccarlo rende l'app inutilizzabile a chi ingrandisce. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Le tue letture, in una stanza sola." />
    <meta name="application-name" content="Montaigne" />
    <meta name="app-version" content="%VITE_APP_VERSION%" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Montaigne" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Il colore lo scrive lo script della luce (`src/lib/luce-browser.ts`). -->
    <meta name="theme-color" content="#e7e1d8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/src/fonts/Fraunces-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/Literata-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/fonts/InterTight-Variable-latin.woff2" as="font" type="font/woff2" crossorigin />
    <title>Montaigne</title>
  </head>
  <body>
    <!-- Prima cosa raggiungibile da tastiera, invisibile finché non prende il
         fuoco. L'ancora `#contenuto` sta sul <main> dell'area protetta. -->
    <a href="#contenuto" class="skip-link">Vai al contenuto</a>
    <div id="root" style="display: contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
